apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradestar-app
  namespace: default
  labels:
    app: gradestar
spec:
  replicas: 2 # Standard high-availability setup (2 separate nodes running the app)
  selector:
    matchLabels:
      app: gradestar
  template:
    metadata:
      labels:
        app: gradestar
    spec:
      containers:
        # === Container 1: The Nginx Web Proxy ===
        - name: nginx
          image: acrgradestarprod.azurecr.io/gradestar-web:latest # Points to your new ACR
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: shared-assets
              mountPath: /var/www

        # === Container 2: The PHP-FPM Application Server ===
        - name: php
          image: acrgradestarprod.azurecr.io/gradestar-app:latest # Points to your new ACR
          ports:
            - containerPort: 9000
              name: fastcgi
          env:
            - name: APP_ENV
              value: "production"
            - name: DB_HOST
              value: "db-gradestar-prod.mysql.database.azure.com" # Your Azure DB address
            # We will use Kubernetes Secrets later to securely inject sensitive keys
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: shared-assets
              mountPath: /var/www

      # Shared in-memory volume so Nginx can see Vite assets generated by the PHP container build
      volumes:
        - name: shared-assets
          emptyDir: {}