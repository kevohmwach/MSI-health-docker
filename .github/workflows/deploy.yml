name: Deploy Gradestar to Production

on:
  push:
    branches:
      - main # Triggers the deployment whenever code is merged to main

permissions:
  id-token: write # Required for secure Azure OpenID Connect (OIDC) authentication 
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 
    steps:
      # 1. Pull down the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Authenticate with Azure securely using OIDC (No long-lived passwords!)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Log into your private Azure Container Registry
      - name: Log in to Azure Container Registry
        run: az acr login --name acrgradestarprod

      # 4. Build and Push the Production Containers
      # This triggers your multi-stage Dockerfile, handling Node/Vite automatically!
      - name: Build and Push Docker Images
        run: |
          docker build -t acrgradestarprod.azurecr.io/gradestar-app:${{ github.sha }} .
          docker build -t acrgradestarprod.azurecr.io/gradestar-app:latest .
          
          docker push acrgradestarprod.azurecr.io/gradestar-app:${{ github.sha }}
          docker push acrgradestarprod.azurecr.io/gradestar-app:latest

          # Build and push the Nginx Web Proxy Image
          docker build -t acrgradestarprod.azurecr.io/gradestar-web:${{ github.sha }} -f docker/nginx/Dockerfile .
          docker build -t acrgradestarprod.azurecr.io/gradestar-web:latest -f docker/nginx/Dockerfile .
          docker push acrgradestarprod.azurecr.io/gradestar-web:${{ github.sha }}
          docker push acrgradestarprod.azurecr.io/gradestar-web:latest

      # 5. Connect to your AKS Cluster context
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'rg-aks-laravel-prod'
          cluster-name: 'gradestar-aks-cluster'

      # 6. Install Helm and Cluster Routing/Security Infrastructure
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Deploy Ingress and Cert-Manager Controllers
        run: |
          # Add necessary Helm charts repositories
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

          # 1. Install Nginx Ingress Controller
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace default \
            --set controller.metrics.enabled=true \
            --set controller.podAnnotations."prometheus\.io/scrape"="true" \
            --set controller.podAnnotations."prometheus\.io/port"="10254" \
            --set 'controller.service.appProtocol=false' \
            --set 'controller.service.annotations.service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-protocol=Tcp' \
            --set 'controller.service.annotations.service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-port=80'


          # 2. Install Cert-Manager (with Custom Resource Definitions enabled)
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set installCRDs=true
            # --set extraArgs='{--dns01-self-check-no-wait=true,--http01-self-check-no-wait=true}'

      # NEW STEP — must run before "Deploy Workload to AKS" below, because that
      # step applies k8s/podMonitor.yml, and PodMonitor is a CRD owned by the
      # Prometheus Operator inside kube-prometheus-stack. Without this step
      # first, that kubectl apply fails with "no matches for kind PodMonitor".
      - name: Deploy Monitoring Stack (Prometheus + Grafana)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f helm/kube-prometheus-stack-values.yaml \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --wait --timeout 15m

      # 7. Apply Kubernetes manifests to pull the new code
      - name: Deploy Workload to AKS
        run: |
          # Apply secrets & configmap first so they are available to the pods
          kubectl apply -f k8s/secrets.yml
          kubectl apply -f k8s/configMap.yml

          # Wait a few seconds for Cert-Manager to completely wake up before issuing certs
          sleep 20 
          kubectl apply -f k8s/certIssuer.yml

          # Substitute the unique commit SHA into deployment manifest
          sed -i "s|acrgradestarprod.azurecr.io/gradestar-app:latest|acrgradestarprod.azurecr.io/gradestar-app:${{ github.sha }}|g" k8s/deployment.yml
          
          kubectl apply -f k8s/pvc.yml
          kubectl delete -f k8s/deployment.yml
          sleep 20
          kubectl apply -f k8s/deployment.yml

          # Deploy routing rules 
          kubectl apply -f k8s/ingress.yml

          # Deploy podMonitor (Expose ingress_contoller_metrics) 
          kubectl apply -f k8s/podMonitorPromeStack.yml

          # Tell Prometheus to scrape custom logs/check ingress annotations 
          # kubectl apply -f k8s/ama-metrics-settings-configmap.yml


          # # 1. Tear down the routing object 
          # kubectl delete -f k8s/ingress.yml

          # # # 2. Wait 5 seconds for the controller hooks to clear
          # # sleep 10

          # # # 3. Bring it back up clean
          # # kubectl apply -f k8s/ingress.yml