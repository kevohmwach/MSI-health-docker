# Self-hosted Prometheus + Grafana, replacing:
#   - azurerm_dashboard_grafana (Managed Grafana, ~$31-37/mo + $6/mo/user)
#   - azurerm_monitor_workspace (Managed Prometheus, billed on ingestion)
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f kube-prometheus-stack-values.yaml
#
# This runs entirely on the AKS nodes you already pay for — no extra Azure
# billing meters. The tradeoff vs Managed Grafana/Prometheus: you own
# upgrades, backup of dashboards/data, and HA — fine for a study/budget
# project, worth revisiting once this is a real production workload.

# --- Prometheus ---
prometheus:
  prometheusSpec:
    retention: 7d          # keep this short on a budget node pool — retention = disk = cost
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-csi   # default AKS storage class, no extra setup
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# --- Grafana ---
grafana:
  enabled: true
  adminPassword: "" # leave blank — set via --set on install or a sealed secret, never commit this
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 400Mi
  # FIX: was 128Mi/256Mi — Grafana pod was CrashLoopBackOff-ing on startup
  # ("Back-off restarting failed container grafana"), consistent with an
  # OOMKill during datasource provisioning/plugin load. Confirm via:
  #   kubectl describe pod -n monitoring -l app.kubernetes.io/name=grafana
  # and check the "Last State: Reason" field — if it says OOMKilled, this is it.
  persistence:
    enabled: true
    storageClassName: managed-csi
    size: 2Gi

  # Reuse the same ingress-nginx + cert-manager setup you already run for
  # cloud.gradestarsolutions.com instead of paying for a separate Managed
  # Grafana endpoint.
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/acme-challenge-type: "http01"
      nginx.ingress.kubernetes.io/enable-real-ip: "true"
    hosts:
      - grafana.gradestarsolutions.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.gradestarsolutions.com

  # NOTE: no manual `datasources:` block here. kube-prometheus-stack already
  # auto-provisions a "Prometheus" datasource pointing at its own bundled
  # Prometheus instance by default (via grafana.sidecar.datasources, enabled
  # out of the box). An earlier version of this file also defined one
  # manually with isDefault: true, which collided with the chart's own
  # auto-generated default and crashed Grafana on startup with:
  #   "Datasource provisioning error: ... Only one datasource per
  #    organization can be marked as default"
  # If you want to confirm it's there once deployed: Grafana UI → Connections
  # → Data sources, you should see one named "Prometheus" already configured.

# --- Alertmanager: off by default to keep footprint minimal; flip on once
# you actually want alerts routed somewhere (Slack, email, etc.)
alertmanager:
  enabled: false

# --- Skip scraping cluster components that don't matter for a single-app
# cluster and just add ingestion volume for no benefit
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false