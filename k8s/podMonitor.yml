apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ingress-nginx-podmonitor
  namespace: default          # namespace where your controller pods run
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx   # match your actual pod labels
  namespaceSelector:
    matchNames:
      - ingress-nginx
  podMetricsEndpoints:
    - port: metrics                 # the named port exposing /metrics
      path: /metrics
      interval: 30s