apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradestar-app
  namespace: default
  labels:
    app: gradestar
spec:
  replicas: 2 # Standard high-availability setup (2 separate nodes running the app) 
  selector:
    matchLabels:
      app: gradestar
  template:
    metadata:
      labels:
        app: gradestar
    spec:
      containers:
        # === Container 1: The Nginx Web Proxy ===
        - name: nginx
          image: acrgradestarprod.azurecr.io/gradestar-web:latest # Points to your new ACR
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: shared-assets
              mountPath: /var/www

        # === Container 2: The PHP-FPM Application Server ===
        - name: php
          image: acrgradestarprod.azurecr.io/gradestar-app:latest # Points to your new ACR
          ports:
            - containerPort: 9000
              name: fastcgi

          envFrom:
            # Inject all plain-text configurations directly from the ConfigMap
            - configMapRef:
                name: gradestar-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gradestar-secrets    # Name of the secret file object
                  key: database-password     # The specific key inside that object

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: gradestar-secrets
                  key: app-key
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: shared-assets
              mountPath: /var/www

      # Shared in-memory volume so Nginx can see Vite assets generated by the PHP container build
      volumes:
        - name: shared-assets
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: gradestar-app-service
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9000 # Change this to 8000, 9000, etc., if your container runs on a different port
      protocol: TCP
  selector:
    app: gradestar# ⚠️ This MUST match the exact label in your Deployment's spec.template.metadata.labels