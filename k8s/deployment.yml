apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradestar-app
  namespace: default
  labels:
    app: gradestar
spec:
  replicas: 1 # Standard high-availability setup (2 separate nodes running the app) 
  selector:
    matchLabels:
      app: gradestar
  template:
    metadata:
      labels:
        app: gradestar
    spec:
      # === Step 1: The Init Container (Pre-population Phase) ===
      initContainers:
        - name: code-provider
          image: acrgradestarprod.azurecr.io/gradestar-app:latest # Points to your backend app image where code is baked
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Populating shared volume..."
              cp -rp /var/www/. /shared-storage/
              echo "Code successfully synchronized. Ready for deployment."
          volumeMounts:
            - name: shared-assets
              mountPath: /shared-storage

      # === Step 2: Runtime Containers (Active App Phase) ===
      containers:
        # === Container 1: The Nginx Web Proxy ===
        - name: nginx
          image: acrgradestarprod.azurecr.io/gradestar-web:latest # Points to your new ACR
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: shared-assets
              mountPath: /var/www

          # Mount 2: The persistent overlay strictly targeting user uploads
            - name: persistent-uploads
              mountPath: /var/www/storage/app

          # readinessProbe:
          #   httpGet:
          #     path: /index.php       # Nginx will try to serve index.php
          #     port: 80
          #   initialDelaySeconds: 5   # Give the initContainer and Nginx 5 seconds to settle
          #   periodSeconds: 10        # Check every 10 seconds

        # === Container 2: The PHP-FPM Application Server ===
        - name: php
          image: acrgradestarprod.azurecr.io/gradestar-app:latest # Points to your new ACR
          ports:
            - containerPort: 9000
              name: fastcgi
          envFrom:
            # Inject all plain-text configurations directly from the ConfigMap
            - configMapRef:
                name: gradestar-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gradestar-secrets    # Name of the secret file object
                  key: database-password     # The specific key inside that object

            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: gradestar-secrets
                  key: app-key
                  
            - name: LOG_CHANNEL
              value: "stderr"
            - name: LOG_DEPRECATIONS_CHANNEL
              value: "null"
            - name: LOG_LEVEL
              value: "debug"

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: shared-assets
              mountPath: /var/www

          # Mount 2: The persistent overlay strictly targeting user uploads
            - name: persistent-uploads
              mountPath: /var/www/storage/app

          # livenessProbe:
          #   tcpSocket:
          #     port: 9000             # Make sure the FastCGI port is wide open and responding
          #   initialDelaySeconds: 10
          #   periodSeconds: 20

      # Shared volume across the Pod context
      volumes:
        - name: shared-assets
          emptyDir: {}

      # Maintains cross-pod access to shared documents
        - name: persistent-uploads
          persistentVolumeClaim:
            claimName: gradestar-storage-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: gradestar-app-service
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80 # NGINX Port
      protocol: TCP
  selector:
    app: gradestar

